<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="100%" height="100%">
  <defs>
    <linearGradient id="lgSofa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa040"/>
      <stop offset="60%" stop-color="#f58220"/>
      <stop offset="100%" stop-color="#cc5a00"/>
    </linearGradient>
    <linearGradient id="lgCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb86c"/>
      <stop offset="100%" stop-color="#e66a05"/>
    </linearGradient>
    <linearGradient id="lgWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8d5b4c"/>
      <stop offset="100%" stop-color="#5c382e"/>
    </linearGradient>
    <linearGradient id="lgLamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
    <linearGradient id="lgPlant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <filter id="lgSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Rug Base / Shadow -->
  <ellipse cx="60" cy="94" rx="52" ry="9" fill="#e9ecef"/>
  <ellipse cx="60" cy="94" rx="42" ry="6" fill="#dee2e6"/>

  <!-- Left: Modern Floor Lamp with Warm Glow -->
  <!-- Lamp Base & Stem -->
  <line x1="18" y1="28" x2="18" y2="92" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="18" cy="92" rx="8" ry="2.5" fill="#2d3748"/>
  <!-- Lamp Shade -->
  <polygon points="12,38 24,38 27,24 9,24" fill="url(#lgLamp)" filter="url(#lgSoftShadow)"/>
  <!-- Light Beam Radiance -->
  <polygon points="12,38 24,38 34,70 2,70" fill="#fff9db" opacity="0.35"/>

  <!-- Center: Luxury Tufted Armchair / Lounge Sofa -->
  <!-- Backrest -->
  <rect x="34" y="28" width="52" height="34" rx="8" fill="url(#lgSofa)" filter="url(#lgSoftShadow)"/>
  <!-- Tufted Buttons on Backrest -->
  <circle cx="46" cy="40" r="2.5" fill="#b34700"/>
  <circle cx="46" cy="40" r="1.5" fill="#ffe0b2"/>
  <circle cx="60" cy="40" r="2.5" fill="#b34700"/>
  <circle cx="60" cy="40" r="1.5" fill="#ffe0b2"/>
  <circle cx="74" cy="40" r="2.5" fill="#b34700"/>
  <circle cx="74" cy="40" r="1.5" fill="#ffe0b2"/>
  <!-- Tuft Crease Lines -->
  <line x1="46" y1="40" x2="60" y2="40" stroke="#d65a00" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="60" y1="40" x2="74" y2="40" stroke="#d65a00" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Armchair Seat Cushion (Thick & Plush) -->
  <rect x="34" y="56" width="52" height="18" rx="6" fill="url(#lgCushion)"/>
  <!-- Highlight on Seat Edge -->
  <line x1="38" y1="58" x2="82" y2="58" stroke="#ffe5b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Armrest -->
  <rect x="28" y="44" width="12" height="30" rx="6" fill="url(#lgSofa)" filter="url(#lgSoftShadow)"/>
  <ellipse cx="34" cy="48" rx="4" ry="2" fill="#ffe5b4" opacity="0.8"/>

  <!-- Right Armrest -->
  <rect x="80" y="44" width="12" height="30" rx="6" fill="url(#lgSofa)" filter="url(#lgSoftShadow)"/>
  <ellipse cx="86" cy="48" rx="4" ry="2" fill="#ffe5b4" opacity="0.8"/>

  <!-- Tapered Wooden Scandinavian Legs -->
  <line x1="34" y1="72" x2="28" y2="92" stroke="url(#lgWood)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="86" y1="72" x2="92" y2="92" stroke="url(#lgWood)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="44" y1="72" x2="40" y2="90" stroke="url(#lgWood)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="76" y1="72" x2="80" y2="90" stroke="url(#lgWood)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Brass Leg Caps -->
  <line x1="29.5" y1="87" x2="28" y2="92" stroke="#ffd166" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="90.5" y1="87" x2="92" y2="92" stroke="#ffd166" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right: Modern Coffee Table & Steaming Beverage -->
  <ellipse cx="100" cy="74" rx="14" ry="5" fill="url(#lgWood)" filter="url(#lgSoftShadow)"/>
  <line x1="100" y1="75" x2="100" y2="92" stroke="url(#lgWood)" stroke-width="3" stroke-linecap="round"/>
  <line x1="94" y1="75" x2="91" y2="92" stroke="url(#lgWood)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="106" y1="75" x2="109" y2="92" stroke="url(#lgWood)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ceramic Coffee Cup with Saucer -->
  <ellipse cx="100" cy="71" rx="5" ry="1.8" fill="#cbd5e1"/>
  <path d="M97 66 H103 V69 C103 71, 97 71, 97 69 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
  <path d="M103 67 Q105 67 105 68.5 Q105 70 103 70" stroke="#cbd5e1" stroke-width="0.8" fill="none"/>
  <!-- Steam rising -->
  <path d="M99 64 Q98 61 100 58 M102 64 Q103 61 101 58" stroke="#a0aec0" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Potted Indoor Plant Behind Sofa -->
  <path d="M102 46 Q108 34 114 38 Q110 48 102 46" fill="url(#lgPlant)"/>
  <path d="M100 50 Q106 42 110 46 Q106 54 100 50" fill="url(#lgPlant)"/>
</svg>
