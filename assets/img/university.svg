<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="100%" height="100%">
  <defs>
    <linearGradient id="unAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="unGlobeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="unLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="unCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1154"/>
      <stop offset="50%" stop-color="#25093b"/>
      <stop offset="100%" stop-color="#150422"/>
    </linearGradient>
    <linearGradient id="unGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f58220"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="unPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="unShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Soft Academic Blue Aura -->
  <circle cx="60" cy="50" r="36" fill="url(#unAura)" opacity="0.6"/>

  <!-- University Classical Colonnade Pediment Base (Foundation of Academia) -->
  <g transform="translate(18, 76)">
    <!-- Base Steps -->
    <rect x="0" y="14" width="84" height="4" rx="1.5" fill="#94a3b8"/>
    <rect x="6" y="10" width="72" height="4" rx="1" fill="#cbd5e1"/>
    <!-- Classical Pillars -->
    <rect x="10" y="0" width="6" height="10" rx="1" fill="url(#unPillar)"/>
    <rect x="28" y="0" width="6" height="10" rx="1" fill="url(#unPillar)"/>
    <rect x="50" y="0" width="6" height="10" rx="1" fill="url(#unPillar)"/>
    <rect x="68" y="0" width="6" height="10" rx="1" fill="url(#unPillar)"/>
  </g>

  <!-- Global Earth Sphere (International Horizons) -->
  <g filter="url(#unShadow)">
    <circle cx="60" cy="52" r="25" fill="url(#unGlobeBlue)"/>
    <!-- Globe Longitude & Latitude Rings -->
    <ellipse cx="60" cy="52" rx="25" ry="10" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="60" cy="52" rx="12" ry="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    <line x1="35" y1="52" x2="85" y2="52" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    <line x1="60" y1="27" x2="60" y2="77" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>

    <!-- Stylized Continents on Globe -->
    <path d="M48 44 C50 40, 56 41, 58 45 C57 48, 52 49, 49 47 Z" fill="url(#unLand)" opacity="0.9"/>
    <path d="M64 45 C67 42, 74 44, 76 48 C74 53, 67 52, 64 48 Z" fill="url(#unLand)" opacity="0.9"/>
    <path d="M52 56 C55 54, 60 55, 62 60 C58 64, 53 62, 52 57 Z" fill="url(#unLand)" opacity="0.9"/>
    <path d="M66 58 C69 57, 73 59, 74 63 C72 65, 68 64, 66 61 Z" fill="url(#unLand)" opacity="0.9"/>
  </g>

  <!-- Soaring Upward Progression Arc (Pathway to Leading Universities) -->
  <path d="M22 68 C30 32, 65 14, 98 22" fill="none" stroke="url(#unGold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Progression Arrow Head -->
  <polygon points="98,22 89,17 92,23 87,27" fill="url(#unGold)"/>

  <!-- Academic Graduation Cap (Mortarboard of High Achievement) -->
  <g transform="translate(60, 24)" filter="url(#unShadow)">
    <!-- Skull Cap Base Under Mortarboard -->
    <path d="M-10 4 C-10 11, 10 11, 10 4 Z" fill="url(#unCap)"/>
    <!-- Diamond Top Board -->
    <polygon points="0,-12 24,0 0,12 -24,0" fill="url(#unCap)"/>
    <polygon points="0,-12 24,0 0,12 -24,0" fill="none" stroke="url(#unGold)" stroke-width="1.2"/>
    <!-- Button on Cap -->
    <circle cx="0" cy="0" r="2.2" fill="url(#unGold)"/>
    <!-- Golden Tassel Draping Down to the Right -->
    <path d="M0 0 C8 1, 15 4, 18 12 L19 22" fill="none" stroke="url(#unGold)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Tassel Fringe Bush -->
    <polygon points="16,22 22,22 20,29 18,29" fill="url(#unGold)"/>
  </g>

  <!-- Rolled Diploma / Degree Scroll in Bottom Left -->
  <g transform="translate(14, 48) rotate(-25)">
    <rect x="0" y="0" width="22" height="7" rx="2" fill="#fffdf5" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Red Ribbon -->
    <rect x="9" y="0" width="4" height="7" fill="#ef4444"/>
    <path d="M11 7 L9 12 L13 12 Z" fill="#ef4444"/>
  </g>

  <!-- International Excellence Stars -->
  <polygon points="104,36 105.5,39.5 109,40 106.5,42.5 107,46 104,44 101,46 101.5,42.5 99,40 102.5,39.5" fill="url(#unGold)"/>
  <circle cx="16" cy="30" r="1.6" fill="#f58220"/>
  <circle cx="94" cy="48" r="1.4" fill="#38bdf8"/>
</svg>
