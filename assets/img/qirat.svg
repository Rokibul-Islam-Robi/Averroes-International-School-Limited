<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="100%" height="100%">
  <defs>
    <linearGradient id="qcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#f58220"/>
      <stop offset="100%" stop-color="#c95700"/>
    </linearGradient>
    <linearGradient id="qcSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="qcDarkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="qcAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="100%" stop-color="#ffe4b5"/>
    </linearGradient>
    <filter id="qcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Soft Aura of Excellence -->
  <circle cx="60" cy="46" r="34" fill="url(#qcAura)" opacity="0.6"/>

  <!-- Winner Laurel Wreath / Crescents of Honor -->
  <!-- Left Wreath Leaf Clusters -->
  <path d="M34 26 C22 40 22 62 34 74" fill="none" stroke="url(#qcGold)" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="26" cy="34" rx="4.5" ry="2.5" transform="rotate(-35 26 34)" fill="url(#qcGold)"/>
  <ellipse cx="22" cy="45" rx="5" ry="2.5" transform="rotate(-15 22 45)" fill="url(#qcGold)"/>
  <ellipse cx="23" cy="56" rx="5" ry="2.5" transform="rotate(15 23 56)" fill="url(#qcGold)"/>
  <ellipse cx="28" cy="66" rx="4.5" ry="2.5" transform="rotate(35 28 66)" fill="url(#qcGold)"/>

  <!-- Right Wreath Leaf Clusters -->
  <path d="M86 26 C98 40 98 62 86 74" fill="none" stroke="url(#qcGold)" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="94" cy="34" rx="4.5" ry="2.5" transform="rotate(35 94 34)" fill="url(#qcGold)"/>
  <ellipse cx="98" cy="45" rx="5" ry="2.5" transform="rotate(15 98 45)" fill="url(#qcGold)"/>
  <ellipse cx="97" cy="56" rx="5" ry="2.5" transform="rotate(-15 97 56)" fill="url(#qcGold)"/>
  <ellipse cx="92" cy="66" rx="4.5" ry="2.5" transform="rotate(-35 92 66)" fill="url(#qcGold)"/>

  <!-- Audio Waveform Energy -->
  <path d="M12 48 Q10 40 8 48 Q10 56 12 48" fill="#f58220" opacity="0.7"/>
  <path d="M108 48 Q110 40 112 48 Q110 56 108 48" fill="#f58220" opacity="0.7"/>
  <line x1="14" y1="42" x2="14" y2="54" stroke="#f58220" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="106" y1="42" x2="106" y2="54" stroke="#f58220" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Studio Mic - External Metal Cradle Arc -->
  <path d="M38 40 C38 64, 82 64, 82 40" fill="none" stroke="url(#qcSilver)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Pivot Knobs on Cradle -->
  <circle cx="38" cy="40" r="3.5" fill="url(#qcGold)"/>
  <circle cx="82" cy="40" r="3.5" fill="url(#qcGold)"/>

  <!-- Microphone Capsule Body -->
  <!-- Top Dome Grille -->
  <path d="M47 32 C47 20, 73 20, 73 32 Z" fill="url(#qcSilver)"/>
  <!-- Cylindrical Lower Grille -->
  <rect x="47" y="32" width="26" height="18" fill="url(#qcSilver)"/>
  <!-- Realistic Mesh Pattern Lines -->
  <line x1="51" y1="26" x2="69" y2="26" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
  <line x1="49" y1="32" x2="71" y2="32" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="48" y1="38" x2="72" y2="38" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
  <line x1="48" y1="44" x2="72" y2="44" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="21" x2="60" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

  <!-- Microphone Handle / Lower Barrel -->
  <rect x="50" y="50" width="20" height="12" rx="2" fill="url(#qcDarkMetal)"/>
  <!-- Golden Accent Ring on Barrel -->
  <rect x="49" y="50" width="22" height="3" fill="url(#qcGold)"/>

  <!-- Heavy Duty Metallic Desk Stand Column -->
  <rect x="57" y="62" width="6" height="24" fill="url(#qcSilver)"/>
  <!-- Collar Ring -->
  <rect x="55" y="80" width="10" height="3" rx="1" fill="url(#qcGold)"/>

  <!-- Weighted Sturdy Desktop Base (3D Elliptical Bevel) -->
  <ellipse cx="60" cy="94" rx="28" ry="7" fill="#334155"/>
  <ellipse cx="60" cy="92" rx="26" ry="6" fill="url(#qcSilver)"/>
  <ellipse cx="60" cy="91" rx="24" ry="4.5" fill="#f8fafc"/>
  <ellipse cx="60" cy="91" rx="20" ry="3.5" fill="url(#qcGold)"/>
</svg>
