<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="100%" height="100%">
  <defs>
    <linearGradient id="scSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f58220"/>
    </linearGradient>
    <linearGradient id="scTentFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa040"/>
      <stop offset="100%" stop-color="#e66a05"/>
    </linearGradient>
    <linearGradient id="scTentSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d65a00"/>
      <stop offset="100%" stop-color="#9a3c00"/>
    </linearGradient>
    <linearGradient id="scTree" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d8a4e"/>
      <stop offset="100%" stop-color="#19542e"/>
    </linearGradient>
    <linearGradient id="scFlame1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d93800"/>
      <stop offset="50%" stop-color="#f58220"/>
      <stop offset="100%" stop-color="#ffde59"/>
    </linearGradient>
    <linearGradient id="scFlame2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f58220"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="scGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sun with Glow -->
  <circle cx="28" cy="24" r="12" fill="url(#scSun)" filter="url(#scGlow)" opacity="0.9"/>
  <circle cx="28" cy="24" r="10" fill="url(#scSun)"/>
  <!-- Sun Rays -->
  <line x1="28" y1="8" x2="28" y2="4" stroke="#ffb347" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="18" x2="11" y2="16" stroke="#ffb347" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="18" x2="45" y2="16" stroke="#ffb347" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pine Tree Left Background -->
  <polygon points="18,58 12,68 15,68 9,78 27,78 21,68 24,68" fill="url(#scTree)"/>
  <rect x="16" y="78" width="4" height="8" rx="1" fill="#6d4c41"/>

  <!-- Pine Tree Right Background -->
  <polygon points="102,52 96,63 99,63 92,75 112,75 105,63 108,63" fill="url(#scTree)"/>
  <rect x="100" y="75" width="4" height="10" rx="1" fill="#6d4c41"/>

  <!-- Ground Terrain Base -->
  <ellipse cx="60" cy="88" rx="54" ry="10" fill="#e8edf2"/>
  <ellipse cx="60" cy="88" rx="46" ry="7" fill="#d2dbe3"/>

  <!-- Realistic Modern Camping Tent (Perspective 3D) -->
  <!-- Left Side Shading -->
  <polygon points="56,28 26,82 56,82" fill="url(#scTentFront)"/>
  <!-- Right Side Shading (Depth) -->
  <polygon points="56,28 56,82 86,72 82,34" fill="url(#scTentSide)"/>
  <!-- Tent Seam Highlight Ridge -->
  <line x1="56" y1="28" x2="82" y2="34" stroke="#ffb347" stroke-width="1.8"/>
  <line x1="56" y1="28" x2="56" y2="82" stroke="#ffbe76" stroke-width="1.5"/>

  <!-- Tent Door (Open Flap with Interior Glow) -->
  <polygon points="56,42 38,82 56,82" fill="#2d1a04"/>
  <polygon points="56,46 44,82 56,82" fill="#ffd166" opacity="0.85"/>
  <!-- Door Flap Curtains -->
  <path d="M56 42 Q46 62 36 82" stroke="#ffbe76" stroke-width="2" fill="none"/>
  <path d="M56 42 Q52 64 48 82" stroke="#e66a05" stroke-width="2" fill="none"/>

  <!-- Tent Pennant Flag -->
  <polygon points="56,28 56,16 66,22" fill="#f58220"/>
  <line x1="56" y1="28" x2="56" y2="15" stroke="#47195d" stroke-width="1.8"/>

  <!-- Campfire with Stones & Glowing Fire -->
  <!-- Stones Ring -->
  <ellipse cx="88" cy="85" rx="16" ry="6" fill="#718096"/>
  <circle cx="76" cy="85" r="3.2" fill="#4a5568"/>
  <circle cx="82" cy="87" r="3.5" fill="#4a5568"/>
  <circle cx="89" cy="88" r="3.8" fill="#4a5568"/>
  <circle cx="96" cy="87" r="3.5" fill="#4a5568"/>
  <circle cx="101" cy="85" r="3.2" fill="#4a5568"/>
  <circle cx="94" cy="83" r="2.8" fill="#2d3748"/>
  <circle cx="83" cy="83" r="2.8" fill="#2d3748"/>

  <!-- Crossed Wood Logs -->
  <line x1="78" y1="87" x2="98" y2="81" stroke="#8d5b4c" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="78" y1="81" x2="98" y2="87" stroke="#6b4235" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Dynamic Realistic Fire Flames -->
  <path d="M88 83 C80 77 82 66 87 60 C89 66 95 69 95 75 C95 82 91 84 88 83 Z" fill="url(#scFlame1)"/>
  <path d="M87 83 C84 79 84 73 87 70 C89 74 91 76 91 80 C91 83 89 84 87 83 Z" fill="url(#scFlame2)"/>
  <!-- Sparks -->
  <circle cx="84" cy="62" r="1.3" fill="#ffde59"/>
  <circle cx="92" cy="58" r="1.5" fill="#ffde59"/>
  <circle cx="87" cy="54" r="1.2" fill="#ff9f43"/>
</svg>
