<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="100%" height="100%">
  <defs>
    <linearGradient id="qrWood1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5b4c"/>
      <stop offset="50%" stop-color="#5c382e"/>
      <stop offset="100%" stop-color="#3d2219"/>
    </linearGradient>
    <linearGradient id="qrWood2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aa715f"/>
      <stop offset="100%" stop-color="#4a281e"/>
    </linearGradient>
    <linearGradient id="qrPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#fff8ed"/>
      <stop offset="100%" stop-color="#faeed7"/>
    </linearGradient>
    <linearGradient id="qrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#f58220"/>
      <stop offset="100%" stop-color="#c95700"/>
    </linearGradient>
    <linearGradient id="qrCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0d3b13"/>
    </linearGradient>
    <filter id="qrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="qrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Spiritual Glow Behind Quran -->
  <circle cx="60" cy="38" r="30" fill="#fff9db" opacity="0.6" filter="url(#qrGlow)"/>

  <!-- Islamic Geometric Rays -->
  <circle cx="60" cy="38" r="28" fill="none" stroke="#fed330" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Wooden Rehal Quran Stand (Back Support Legs) -->
  <path d="M26 88 L60 56 L94 88" stroke="url(#qrWood1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Decorative Cutout Arch in Rehal -->
  <path d="M38 88 L60 67 L82 88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" fill="none"/>

  <!-- Leather Outer Binding of Quran (Extends beyond pages) -->
  <path d="M60 56 C44 40, 16 43, 8 47 L8 21 C18 16, 46 16, 60 33 C74 16, 102 16, 112 21 L112 47 C104 43, 76 40, 60 56 Z" fill="url(#qrCover)" filter="url(#qrShadow)"/>
  <!-- Gold Gilded Outer Edge Rim -->
  <path d="M8 21 C18 16, 46 16, 60 33 C74 16, 102 16, 112 21" fill="none" stroke="url(#qrGold)" stroke-width="2"/>
  <path d="M8 47 C18 43, 46 40, 60 56 C74 40, 102 43, 112 47" fill="none" stroke="url(#qrGold)" stroke-width="2"/>

  <!-- Open Quran Book Pages (Thick Curved Ivory Layers) -->
  <!-- Left Page Stack -->
  <path d="M60 54 C46 39, 20 42, 11 45 L11 22 C20 18, 46 18, 60 34 Z" fill="url(#qrPage)"/>
  <!-- Right Page Stack -->
  <path d="M60 54 C74 39, 100 42, 109 45 L109 22 C100 18, 74 18, 60 34 Z" fill="url(#qrPage)"/>

  <!-- Ornate Golden Borders on Pages -->
  <rect x="16" y="24" width="38" height="24" rx="2" fill="none" stroke="url(#qrGold)" stroke-width="1" opacity="0.8"/>
  <rect x="66" y="24" width="38" height="24" rx="2" fill="none" stroke="url(#qrGold)" stroke-width="1" opacity="0.8"/>

  <!-- Fine Quranic Arabic Calligraphy Simulation Lines -->
  <!-- Left Page Lines -->
  <line x1="20" y1="28" x2="50" y2="28" stroke="#5c382e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="34" x2="51" y2="34" stroke="#5c382e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="40" x2="48" y2="40" stroke="#5c382e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ornamental Gold Verse Markers -->
  <circle cx="35" cy="44" r="1.8" fill="url(#qrGold)"/>

  <!-- Right Page Lines -->
  <line x1="70" y1="28" x2="100" y2="28" stroke="#5c382e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="69" y1="34" x2="101" y2="34" stroke="#5c382e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="40" x2="100" y2="40" stroke="#5c382e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ornamental Gold Verse Markers -->
  <circle cx="85" cy="44" r="1.8" fill="url(#qrGold)"/>

  <!-- Center Spine Crease / Valley -->
  <line x1="60" y1="34" x2="60" y2="54" stroke="#d2b48c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Elegant Silk Bookmark Ribbon (Flowing down with Gold Tassel) -->
  <path d="M60 33 Q64 45 66 66 L62 64 L58 66 Q61 46 60 33 Z" fill="url(#qrGold)" filter="url(#qrShadow)"/>
  <!-- Bookmark Tassel -->
  <line x1="62" y1="65" x2="62" y2="72" stroke="#e66a05" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="62" cy="73" r="1.2" fill="#ffd56b"/>

  <!-- Wooden Rehal Quran Stand (Front Crossing Legs with Depth) -->
  <path d="M22 60 L60 92 L98 60" stroke="url(#qrWood2)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#qrShadow)"/>
  <path d="M34 94 L60 74 L86 94" stroke="url(#qrWood2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
