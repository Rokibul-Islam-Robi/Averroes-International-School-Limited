<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="pencilWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0cc"/>
      <stop offset="100%" stop-color="#e2bc74"/>
    </linearGradient>
    <linearGradient id="pencilYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6be44"/>
      <stop offset="50%" stop-color="#ffce63"/>
      <stop offset="100%" stop-color="#e0a229"/>
    </linearGradient>
    <linearGradient id="ferruleMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b5be"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8e94a0"/>
    </linearGradient>
    <linearGradient id="planetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f7f5fc"/>
      <stop offset="100%" stop-color="#ded8f0"/>
    </linearGradient>
  </defs>

  <!-- Stars & Space Sparkles -->
  <g fill="#f58220" opacity="0.9">
    <!-- 4-Point Stars -->
    <path d="M420 50 Q420 62 432 62 Q420 62 420 74 Q420 62 408 62 Q420 62 420 50 Z"/>
    <path d="M120 100 Q120 108 128 108 Q120 108 120 116 Q120 108 112 108 Q120 108 120 100 Z"/>
    <path d="M480 340 Q480 348 488 348 Q480 348 480 356 Q480 348 472 348 Q480 348 480 340 Z"/>
    <path d="M80 330 Q80 336 86 336 Q80 336 80 342 Q80 336 74 336 Q80 336 80 330 Z"/>
    <path d="M320 370 Q320 376 326 376 Q320 376 320 382 Q320 376 314 376 Q320 376 320 370 Z"/>
    <path d="M250 80 Q250 85 255 85 Q250 85 250 90 Q250 85 245 85 Q250 85 250 80 Z"/>

    <!-- Small Star Dots -->
    <circle cx="95" cy="180" r="2.5"/>
    <circle cx="210" cy="45" r="3"/>
    <circle cx="360" cy="120" r="2.5"/>
    <circle cx="490" cy="190" r="3"/>
    <circle cx="470" cy="270" r="2.5"/>
    <circle cx="295" cy="410" r="2.5"/>
    <circle cx="160" cy="420" r="3"/>
    <circle cx="50" cy="260" r="2.5"/>
  </g>

  <!-- Purple Constellation Sparks -->
  <g fill="#47195d" opacity="0.75">
    <circle cx="440" cy="140" r="2"/>
    <circle cx="230" cy="140" r="2.5"/>
    <circle cx="340" cy="30" r="2"/>
    <circle cx="390" cy="390" r="2"/>
  </g>

  <!-- Saturn Planet Bottom-Left -->
  <g id="saturnPlanet">
    <!-- Back of the Ring -->
    <path d="M60 335 C80 295, 260 280, 280 325" fill="none" stroke="#47195d" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 340 C70 290, 275 272, 292 330" fill="none" stroke="#47195d" stroke-width="2" stroke-linecap="round"/>

    <!-- Planet Sphere -->
    <circle cx="170" cy="330" r="62" fill="url(#planetGrad)" stroke="#47195d" stroke-width="3.5"/>

    <!-- Line Shading on Planet Lower Shadow -->
    <g stroke="#47195d" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <path d="M140 365 C160 372, 190 372, 212 360"/>
      <path d="M148 375 C168 381, 188 381, 204 372"/>
      <path d="M158 384 C172 388, 184 388, 196 382"/>
      <!-- Surface Hatching -->
      <line x1="150" y1="345" x2="160" y2="355"/>
      <line x1="162" y1="343" x2="174" y2="355"/>
      <line x1="176" y1="345" x2="186" y2="355"/>
      <line x1="188" y1="347" x2="198" y2="357"/>
    </g>

    <!-- Front of the Ring Passing Over Planet -->
    <path d="M280 325 C260 370, 80 385, 60 335" fill="none" stroke="#47195d" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M292 330 C270 380, 70 398, 48 340" fill="none" stroke="#47195d" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Outer Rim Connector -->
    <path d="M60 335 C52 337, 46 339, 48 340" fill="none" stroke="#47195d" stroke-width="3"/>
    <path d="M280 325 C288 327, 294 329, 292 330" fill="none" stroke="#47195d" stroke-width="3"/>

    <!-- Ring Line Details -->
    <path d="M75 342 C100 375, 235 365, 265 330" fill="none" stroke="#47195d" stroke-width="1.5" stroke-dasharray="8 6"/>
  </g>

  <!-- Billowing Smoke Cloud Launch Trail -->
  <g fill="#ffffff" stroke="#47195d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cloud Puffs Around Planet & Rocket Base -->
    <path d="M140 280 C130 260, 155 240, 175 250 C190 230, 220 235, 230 255 C245 245, 270 255, 265 275 C280 285, 280 310, 265 320 C250 330, 220 330, 210 315 C200 330, 170 330, 155 315 C140 320, 125 305, 140 280 Z"/>

    <!-- Upper Smoke Puffs Rising Toward Rocket -->
    <path d="M215 240 C210 215, 235 195, 255 205 C270 185, 300 190, 310 210 C325 200, 350 215, 345 235 C330 250, 305 255, 290 240 C275 255, 240 255, 225 240 Z" fill="#ffffff"/>

    <path d="M280 185 C285 165, 310 155, 325 170 C340 155, 365 165, 370 185 C380 195, 375 215, 355 220 C340 225, 315 220, 305 205 C295 210, 280 200, 280 185 Z" fill="#ffffff"/>
  </g>

  <!-- Smoke Swirl & Trajectory Lines -->
  <g stroke="#f58220" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="4 6">
    <path d="M190 290 C220 250, 250 210, 310 170 C330 155, 360 135, 380 120"/>
    <path d="M210 320 C240 280, 280 230, 340 190"/>
  </g>

  <!-- THE PENCIL ROCKET (Angled ~38 Degrees Toward Top-Right) -->
  <g transform="translate(370, 130) rotate(-48)">

    <!-- Rocket Exhaust Flames -->
    <g transform="translate(0, 135)">
      <path d="M-10 0 C-15 25, -5 45, 0 60 C5 45, 15 25, 10 0 Z" fill="#ff7675" stroke="#47195d" stroke-width="2.5"/>
      <path d="M-6 0 C-10 18, -3 32, 0 42 C3 32, 10 18, 6 0 Z" fill="#fbc02d" stroke="#f58220" stroke-width="2"/>
    </g>

    <!-- Purple Left Fin / Wing -->
    <path d="M-18 80 L-50 120 C-48 135, -30 138, -18 128 Z" fill="#ffffff" stroke="#47195d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-22 92 L-42 120 C-40 126, -30 128, -22 122 Z" fill="#47195d" opacity="0.15"/>

    <!-- Purple Right Fin / Wing -->
    <path d="M18 80 L50 120 C48 135, 30 138, 18 128 Z" fill="#ffffff" stroke="#47195d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M22 92 L42 120 C40 126, 30 128, 22 122 Z" fill="#47195d" opacity="0.15"/>

    <!-- Pencil Pink Rubber Eraser -->
    <path d="M-16 114 C-16 132, 16 132, 16 114 Z" fill="#ff7675" stroke="#47195d" stroke-width="3"/>
    <path d="M-16 114 L16 114" stroke="#47195d" stroke-width="2"/>

    <!-- Corrugated Metal Ferrule -->
    <rect x="-17" y="96" width="34" height="18" rx="2" fill="url(#ferruleMetal)" stroke="#47195d" stroke-width="3"/>
    <line x1="-17" y1="102" x2="17" y2="102" stroke="#47195d" stroke-width="1.8"/>
    <line x1="-17" y1="108" x2="17" y2="108" stroke="#47195d" stroke-width="1.8"/>

    <!-- Main Yellow Hexagonal Pencil Shaft -->
    <rect x="-18" y="-40" width="36" height="136" rx="2" fill="url(#pencilYellow)" stroke="#47195d" stroke-width="3"/>
    <!-- Pencil Facet Lines -->
    <line x1="-6" y1="-40" x2="-6" y2="96" stroke="#47195d" stroke-width="2.2" opacity="0.8"/>
    <line x1="6" y1="-40" x2="6" y2="96" stroke="#47195d" stroke-width="2.2" opacity="0.8"/>

    <!-- Sharpened Wooden Cone -->
    <path d="M-18 -40 L0 -96 L18 -40 Z" fill="url(#pencilWood)" stroke="#47195d" stroke-width="3" stroke-linejoin="round"/>
    <!-- Wood Scallop Collar -->
    <path d="M-18 -40 Q-9 -34 0 -40 Q9 -34 18 -40" fill="none" stroke="#47195d" stroke-width="2.5"/>

    <!-- Lead / Graphite Pencil Tip -->
    <path d="M-7 -74 L0 -96 L7 -74 Z" fill="#2d3436" stroke="#47195d" stroke-width="2" stroke-linejoin="round"/>

    <!-- Stamped "HB" Pencil Brand Mark -->
    <g transform="translate(0, 30) rotate(90)">
      <rect x="-18" y="-8" width="36" height="16" rx="3" fill="#ffffff" stroke="#47195d" stroke-width="1.5"/>
      <text x="0" y="4" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="900" fill="#47195d" text-anchor="middle" letter-spacing="1">HB</text>
    </g>
  </g>
</svg>
